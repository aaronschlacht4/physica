<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Physica – a gravity sandbox</title>
    <meta name="description" content="Throw a planet at a star and watch the orbit it follows. The whole ellipse is drawn before you let go." />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='%23ffcf6e'/%3E%3Ccircle cx='26' cy='10' r='1.8' fill='%23a9c9e8'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200;0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <section class="sky">
      <canvas id="space" aria-label="A star with planets orbiting it. Drag to throw a new planet."></canvas>

      <header class="masthead">
        <h1>Physica</h1>
        <p>A gravity sandbox. Drag anywhere to throw a planet, and the curve you see is the orbit it will follow.</p>
      </header>

      <div class="bar">
        <label for="mass">Mass</label>
        <input id="mass" type="range" min="0" max="1" step="0.001" value="0.37" />
        <span id="mass-value" class="reading"></span>
        <label class="check"><input id="trails" type="checkbox" checked /> Trails</label>
        <button id="pause" type="button">Pause</button>
        <button id="clear" type="button">Clear</button>
        <span id="status" class="reading status"></span>
      </div>
    </section>

    <main>
      <article id="how" class="doc"></article>
      <footer>Made by Aaron Schlacht. <a href="https://github.com/aaronschlacht4/physica">Source on GitHub</a>.</footer>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
