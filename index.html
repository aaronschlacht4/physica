<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Physica – a plate of orbits</title>
    <meta name="description" content="Throw a planet at a star and it inks its orbit onto the page. The whole ellipse is drawn before you let go." />
    <meta name="theme-color" content="#e9e6dc" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23e9e6dc'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23191712' stroke-width='1.6'/%3E%3Ccircle cx='16' cy='16' r='2.4' fill='%23191712'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="page">
      <header class="masthead">
        <h1>Physica</h1>
        <p>A plate of orbits, drawn as they happen.</p>
      </header>

      <figure class="plate">
        <div class="frame">
          <canvas id="space" aria-label="A star with planets orbiting it, each inking its path. Drag to throw a new planet."></canvas>
        </div>

        <figcaption>
          <p class="legend">
            Drag anywhere within the plate to throw a planet. The blue line is the orbit it will follow, worked out
            before you let go; the ink behind each planet is where it has already been.
          </p>
          <div class="controls">
            <span class="control">
              <label for="mass">Mass</label>
              <input id="mass" type="range" min="0" max="1" step="0.001" value="0.37" />
              <span id="mass-value" class="reading"></span>
            </span>
            <label class="control check"><input id="ink" type="checkbox" checked /> Ink</label>
            <button id="pause" type="button">Pause</button>
            <button id="clear" type="button">Wipe the plate</button>
            <span id="status" class="reading tally"></span>
          </div>
        </figcaption>
      </figure>

      <article id="how" class="doc"></article>

      <footer>Made by Aaron Schlacht. <a href="https://github.com/aaronschlacht4/physica">Source on GitHub</a>.</footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
