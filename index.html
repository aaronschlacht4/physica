<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Physica – a gravity sandbox</title>
    <meta name="description" content="Drag to throw a planet around a star and watch where gravity takes it." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23111214'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23ffd27a'/%3E%3Ccircle cx='26' cy='11' r='2' fill='%238ecbff'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <main>
      <header>
        <h1>Physica</h1>
        <p>A gravity sandbox. Drag anywhere in the sky below to throw a planet at the star; the dotted line shows where it will go.</p>
      </header>

      <canvas id="space" aria-label="Gravity sandbox. Drag to throw a planet."></canvas>

      <div class="bar">
        <label>Mass <input id="mass" type="range" min="0" max="1" step="0.001" value="0.37" /> <span id="mass-value"></span></label>
        <label><input id="trails" type="checkbox" checked /> Trails</label>
        <button id="pause" type="button">Pause</button>
        <button id="clear" type="button">Clear</button>
        <span class="status" id="status"></span>
      </div>

      <section id="how" class="doc"></section>

      <footer>Made by Aaron Schlacht. <a href="https://github.com/aaronschlacht4/physica">Source on GitHub</a>.</footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
